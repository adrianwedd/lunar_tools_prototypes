[project]
name = "lunar_tools_art"
version = "0.1.0"
description = "A collection of audiovisual art installations using Lunar Tools."
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ollama",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp",
    "opentelemetry-instrumentation-logging",
    "python-dotenv",
    "librosa",
    "pydub",
    "requests",
    "httpx",
    "numpy",
    "opencv-python",
    "toml",
    "pillow",
]

[project.optional-dependencies]
vision = [
    "opencv-python>=4.10,<5",
]
audio = [
    "soundfile",
    "faster-whisper>=1.0",
]
gpu = [
    # Add GPU-specific dependencies here, e.g., "torch[cuda]"
]
cloud = ["openai>=1.40", "anthropic>=0.40.0", "replicate>=0.30"]
tracing = ["langsmith>=0.1"]
mlx = ["mlx>=0.26", "mlx-whisper>=0.4", "mlx-lm>=0.24", "mflux>=0.6"]
hw = ["sounddevice>=0.5", "pyglet>=2.0", "mido>=1.3", "python-rtmidi>=1.5", "pyzmq>=26", "pynput>=1.7"]
dev = ["pytest>=8", "pytest-mock>=3.14", "pytest-cov>=4", "responses>=0.25", "pip-tools", "pre-commit", "bandit", "detect-secrets"]

[project.urls]
Homepage = "https://github.com/yourusername/lunar_tools_art"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
filterwarnings = [
    # DeprecatedAlias (src/lunar_tools_art/tools/images.py) intentionally
    # warns at legacy call sites (SDXL_TURBO, Dalle3ImageGenerator, etc.)
    # every time a prototype uses them, by design. That's real, wanted
    # runtime signal — but it's noise across the ~14 legacy smoke-test call
    # sites. The dedicated alias unit tests assert it directly via
    # `pytest.warns`, which is unaffected by this filter.
    "ignore:.* is deprecated; use manager\\.image_gen directly:DeprecationWarning",
]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["S101"]

[tool.black]
target-version = ['py310']
line-length = 88

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 88

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
