name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for better analysis

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install security tools
      run: |
        pip install bandit safety detect-secrets

    - name: Run Bandit security linter
      run: |
        bandit -r src/ prototypes/ -f json -o bandit-report.json || true
        bandit -r src/ prototypes/ -f txt

    - name: Run Safety dependency scanner
      run: |
        safety check --json --output safety-report.json || true
        safety check

    - name: Run detect-secrets
      run: |
        detect-secrets scan --all-files --baseline .secrets.baseline || true

    - name: Upload security reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-reports
        path: |
          bandit-report.json
          safety-report.json

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    # Linux CI intentionally installs only the "dev" extra — no "mlx" or
    # "hw" extras. All Apple Silicon / hardware imports (mlx, mlx-whisper,
    # mlx-lm, mflux, sounddevice, pyglet, mido, python-rtmidi, pyzmq,
    # pynput) are lazy inside src/lunar_tools_art/tools/, so a green run
    # here on plain Linux is the proof those imports never happen at
    # module load time. LUNAR_HEADLESS=1 additionally swaps in the
    # deterministic in-repo fakes (see src/lunar_tools_art/tools/) for
    # every hardware/cloud-backed tool.
    - name: Install package (dev extra only)
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run tests (headless)
      run: |
        LUNAR_HEADLESS=1 pytest -q --cov=src/lunar_tools_art --cov-report=xml --cov-report=html
      env:
        # Mock environment variables for testing
        OPENAI_API_KEY: "test-key"
        REPLICATE_API_TOKEN: "test-token"
        LUNAR_HEADLESS: "1"

    - name: Upload test reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-reports-py${{ matrix.python-version }}
        path: |
          htmlcov/
          coverage.xml

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install quality tools
      run: |
        pip install black==25.1.0 isort==6.0.1 ruff==0.12.7 mypy

    - name: Check code formatting with Black
      run: |
        black --check --diff src/ prototypes/ tests/

    - name: Check import sorting with isort
      run: |
        isort --check-only --diff src/ prototypes/ tests/

    - name: Run Ruff linter
      run: |
        ruff check src/ prototypes/ tests/

    - name: Run type checking with mypy
      run: |
        mypy src/lunar_tools_art/ --ignore-missing-imports --no-strict-optional
      continue-on-error: true  # Don't fail CI for type errors initially
